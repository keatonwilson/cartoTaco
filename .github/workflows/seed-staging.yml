name: Seed Staging from Prod

# Copies the taco content tables from prod into staging.
#
# Deliberately NOT a whole-database dump. Supabase owns the auth/storage/
# realtime schemas and we can't restore into them (permission denied on every
# statement), and a plain CREATE+COPY dump collides with staging's existing
# tables and rows — Postgres aborts each COPY on the first duplicate key, so
# the restore is all-or-nothing per table and lands nothing.
#
# ON_ERROR_STOP=1 is load-bearing: without it psql exits 0 no matter how many
# statements failed, and this job reports success having copied zero rows.

on:
  workflow_dispatch:

env:
  # Content tables only. User-generated data (favorites, vibe votes, profiles,
  # submissions, summit sessions) stays whatever staging already had — those
  # rows reference auth.users, which we don't copy.
  CONTENT_TABLES: >-
    public.sites
    public.descriptions
    public.menu
    public.hours
    public.salsa
    public.protein
    public.item_spec
    public.protein_spec
    public.salsa_spec

jobs:
  seed:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Add client to PATH
        run: echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dump prod content tables
        run: |
          pg_dump --data-only --no-owner --no-acl \
            $(for t in $CONTENT_TABLES; do printf -- '-t %s ' "$t"; done) \
            -d "$PROD_DB_URL" -f data.sql
          echo "dump: $(wc -l < data.sql) lines"
        env:
          PROD_DB_URL: ${{ secrets.SUPABASE_DB_URL_PROD }}

      # The TRUNCATE CASCADE also reaches every table with a foreign key to a
      # content table:
      #   - user_favorites and vibe_votes (via sites, migration 030). Intended:
      #     those rows point at est_ids we're about to replace.
      #   - the Salsa Atlas: salsa_styles (via salsa_spec), and with it
      #     site_salsas and user_favorite_salsas. NOT intended: the catalog text,
      #     draft styles and field sightings are curated on staging, prod may
      #     not have them, and nothing else can bring them back.
      # So the atlas is copied aside, the content replaced, and the atlas put
      # back, all in one transaction (-1): a failure anywhere leaves staging as
      # it was. Rows are copied with SELECT *, so this works whichever atlas
      # migrations staging has run.
      - name: Replace staging content, keeping the Salsa Atlas
        run: |
          cat > seed.sql <<'SQL'
          CREATE TEMP TABLE bak_styles AS SELECT * FROM public.salsa_styles;
          CREATE TEMP TABLE bak_links  AS SELECT * FROM public.site_salsas;
          CREATE TEMP TABLE bak_favs   AS SELECT * FROM public.user_favorite_salsas;
          SQL
          echo "TRUNCATE $(echo $CONTENT_TABLES | tr ' ' ',') CASCADE;" >> seed.sql
          cat >> seed.sql <<'SQL'
          \i data.sql
          -- data.sql empties search_path, so everything below is schema-qualified.

          -- A link whose spot no longer exists can't come back. Losing a bare
          -- link is fine (the spot is gone); losing recorded field work is not.
          DO $$
          DECLARE n int;
          BEGIN
            SELECT count(*) INTO n FROM pg_temp.bak_links b
             WHERE b.est_id NOT IN (SELECT est_id FROM public.sites)
               AND EXISTS (SELECT 1 FROM jsonb_each(to_jsonb(b)) e
                            WHERE e.key IN ('photo_url', 'palette', 'observed_at', 'heat', 'house_name', 'note')
                              AND e.value <> 'null'::jsonb);
            IF n > 0 THEN
              RAISE EXCEPTION '% salsa sighting(s) belong to spots that are not in prod. Nothing was changed. Add those spots to prod (or move the sightings) and run again.', n;
            END IF;
          END $$;

          UPDATE pg_temp.bak_styles SET spec_id = NULL
           WHERE spec_id NOT IN (SELECT id FROM public.salsa_spec);
          -- Fires the resync trigger, which links styles to the new salsa rows;
          -- those links are replaced by the saved ones just below.
          INSERT INTO public.salsa_styles OVERRIDING SYSTEM VALUE SELECT * FROM pg_temp.bak_styles;
          DELETE FROM public.site_salsas;
          INSERT INTO public.site_salsas SELECT * FROM pg_temp.bak_links
           WHERE est_id IN (SELECT est_id FROM public.sites);
          INSERT INTO public.user_favorite_salsas SELECT * FROM pg_temp.bak_favs;
          -- Re-sync so keyed links follow prod's salsa rows. Hand-made links
          -- and recorded sightings are kept by the sync itself.
          UPDATE public.salsa SET est_id = est_id;
          SQL
          psql -v ON_ERROR_STOP=1 -1 -d "$STAGING_DB_URL" -f seed.sql
        env:
          STAGING_DB_URL: ${{ secrets.SUPABASE_DB_URL_STAGING }}

      - name: Report row counts
        run: |
          psql -v ON_ERROR_STOP=1 -d "$STAGING_DB_URL" -c \
            "SELECT 'sites' AS t, count(*) FROM public.sites
             UNION ALL SELECT 'menu', count(*) FROM public.menu
             UNION ALL SELECT 'salsa', count(*) FROM public.salsa
             UNION ALL SELECT 'protein', count(*) FROM public.protein
             UNION ALL SELECT 'salsa_styles', count(*) FROM public.salsa_styles
             UNION ALL SELECT 'site_salsas', count(*) FROM public.site_salsas
             UNION ALL SELECT 'sites_complete', count(*) FROM public.sites_complete;"
        env:
          STAGING_DB_URL: ${{ secrets.SUPABASE_DB_URL_STAGING }}
