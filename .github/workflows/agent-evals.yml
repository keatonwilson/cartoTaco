name: Agent evals

# The concierge's eval gate: runs the golden set (evals/golden/concierge.jsonl)
# with the Haiku judge whenever the concierge or the code it leans on changes,
# and fails under the bars in evals/run.js (deterministic, router, judge ≥ 90%).
# Costs about $0.15 a run.
#
# PRs run locally (--local) so an unmerged golden file never rewrites the
# shared LangSmith dataset; pushes to staging sync the dataset and record an
# experiment. Skipped when ANTHROPIC_API_KEY isn't set (e.g. fork PRs).

on:
  pull_request:
    paths:
      - 'src/lib/server/agent/**'
      - 'src/lib/search.js'
      - 'src/lib/intentRules.js'
      - 'src/lib/siteModel.js'
      - 'src/lib/hours.js'
      - 'evals/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/agent-evals.yml'
  push:
    branches: [staging]
    paths:
      - 'src/lib/server/agent/**'
      - 'src/lib/search.js'
      - 'src/lib/intentRules.js'
      - 'src/lib/siteModel.js'
      - 'src/lib/hours.js'
      - 'evals/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/agent-evals.yml'

permissions:
  contents: read

concurrency:
  group: agent-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Concierge golden set
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Skip without an API key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::ANTHROPIC_API_KEY isn't set; skipping the concierge evals"

      - uses: actions/checkout@v4
        if: env.ANTHROPIC_API_KEY != ''

      - uses: pnpm/action-setup@v4
        if: env.ANTHROPIC_API_KEY != ''
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: env.ANTHROPIC_API_KEY != ''
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: env.ANTHROPIC_API_KEY != ''

      - name: Eval (local, PR)
        if: env.ANTHROPIC_API_KEY != '' && github.event_name == 'pull_request'
        run: pnpm eval --judge --local

      - name: Eval (LangSmith experiment, staging)
        if: env.ANTHROPIC_API_KEY != '' && github.event_name == 'push'
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: 'true'
        run: pnpm eval --judge

      - name: Results
        if: always() && env.ANTHROPIC_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
          if-no-files-found: ignore
